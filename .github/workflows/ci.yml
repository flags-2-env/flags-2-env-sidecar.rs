name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact candidate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy

      - name: Generate candidate lockfile
        run: cargo +1.90.0 generate-lockfile

      - name: Verify dependency graph
        run: cargo +1.90.0 metadata --locked --format-version 1 > /dev/null

      - name: Format
        run: cargo +1.90.0 fmt --all -- --check

      - name: Clippy
        run: cargo +1.90.0 clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo +1.90.0 test --all-targets --locked

      - name: Exercise the real flags-2-env boundary
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.90.0 run --quiet --locked --bin flags2env-platform-sidecar -- preflight

          if FLAGS_2_ENV_SIDECAR_BIND=not-a-socket \
            cargo +1.90.0 run --quiet --locked --bin flags2env-platform-sidecar -- preflight; then
            echo "invalid environment bind unexpectedly passed" >&2
            exit 1
          fi

          FLAGS_2_ENV_SIDECAR_BIND=not-a-socket \
            cargo +1.90.0 run --quiet --locked --bin flags2env-platform-sidecar -- \
              preflight --bind=127.0.0.1:19090

          set +e
          rejected="$(
            cargo +1.90.0 run --quiet --locked --bin flags2env-platform-sidecar -- \
              --definitely-not-declared=synthetic-secret-never-reflect 2>&1
          )"
          status=$?
          set -e
          test "$status" -ne 0
          if grep -F "synthetic-secret-never-reflect" <<<"$rejected"; then
            echo "rejected argv value leaked into diagnostics" >&2
            exit 1
          fi

      - name: Build and exercise distroless image
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag flags2env-platform-sidecar:ci .
          docker run --rm flags2env-platform-sidecar:ci preflight

          docker run --detach --name flags2env-sidecar-ci flags2env-platform-sidecar:ci
          trap 'docker rm --force flags2env-sidecar-ci >/dev/null 2>&1 || true' EXIT
          ready=0
          for _ in $(seq 1 30); do
            if docker exec flags2env-sidecar-ci /flags2env-platform-sidecar probe; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          docker exec flags2env-sidecar-ci /flags2env-platform-sidecar probe-readyz

      - name: Retain generated lockfile
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flags2env-sidecar-lock-${{ github.event.pull_request.head.sha || github.sha }}
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 7
