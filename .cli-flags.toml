# flags-2-env surface for `flags-2-env-sidecar`
[identity]
service = "flags-2-env-sidecar"
type_name = "SidecarEnv"

[help]
url = "https://github.com/flags-2-env/flags-2-env-sidecar.rs"
columns = ["options", "env", "type", "default", "description"]

[parse]
allow_unknown = false

[flags.bind]
env = "FLAGS_2_ENV_SIDECAR_BIND"
long = "bind"
type = "string"
default = "127.0.0.1:9090"
help = "HTTP listen address for /healthz /readyz /metrics."
